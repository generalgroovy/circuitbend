name: Workspace browser checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check sandbox-runtime.js && node --check sandbox-samples.js
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/workspace.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-report
          path: test-results/
